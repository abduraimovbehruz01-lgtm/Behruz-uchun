# Manhora rasmlar xizmatini (Cloudflare Worker) joylash va botga ulash.
# Kerakli GitHub Secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" shabloni) va BOT_TOKEN (@BotFather tokeni).
# Ixtiyoriy: CLOUDFLARE_ACCOUNT_ID (Cloudflare'da bir nechta hisob bo'lsa).
name: Manhora rasmlar xizmati (Cloudflare)

on:
  push:
    branches: [manga-tarjima]
    paths:
      - "worker/**"
      - ".github/workflows/manhora-worker.yml"

concurrency:
  group: manhora-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kalitlar bormi
        id: chk
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BT: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$CF" ] || [ -z "$BT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN yoki BOT_TOKEN GitHub Secrets'da yo'q — joylash o'tkazib yuborildi"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Worker'ni Cloudflare'ga joylash
        id: deploy
        if: steps.chk.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Botga ulash
        if: steps.chk.outputs.ok == '1'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          URL1: ${{ steps.deploy.outputs.deployment-url }}
          OUT: ${{ steps.deploy.outputs.command-output }}
          BOT_URL: https://manga-tarjima.onrender.com
        run: |
          URL="$URL1"
          if [ -z "$URL" ]; then
            URL=$(printf '%s' "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          fi
          URL="${URL%/}"
          if [ -z "$URL" ]; then echo "::error::Worker manzili topilmadi"; exit 1; fi
          echo "Worker: $URL"
          curl -s "$URL/health" || true; echo
          for i in 1 2 3 4 5 6 7 8; do
            TS=$(date +%s)
            SIG=$(printf '%s' "reg:$URL:$TS" | openssl dgst -sha256 -hmac "$BOT_TOKEN" -r | cut -d' ' -f1)
            CODE=$(curl -s -m 90 -o /tmp/r.txt -w '%{http_code}' -X POST "$BOT_URL/api/worker" \
              -H 'Content-Type: application/json' \
              -d "{\"url\":\"$URL\",\"ts\":$TS,\"sig\":\"$SIG\"}" || echo 000)
            echo "urinish $i: $CODE $(cat /tmp/r.txt 2>/dev/null)"
            if [ "$CODE" = "200" ]; then echo "✅ Bot rasmlar xizmatiga ulandi"; exit 0; fi
            if [ "$CODE" = "403" ] || [ "$CODE" = "400" ]; then exit 1; fi
            sleep 30   # bepul server uxlab yotgan bo'lishi mumkin
          done
          exit 1
