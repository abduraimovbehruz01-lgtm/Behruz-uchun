<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Manhora</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0b10;--card:#15151d;--card2:#1d1d28;--line:#272734;--text:#f4f4f8;--muted:#9a9aae;--dim:#6c6c80;
--acc:#ff5a36;--acc2:#ff9a3c;--gold:#ffc53d;--green:#39d07c;--red:#ff4d63;--r:14px;--safe:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(66px + var(--safe));min-height:100vh;overscroll-behavior-y:none}
body.reading{padding-bottom:0;background:#000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
img{display:block}
a{color:var(--acc2)}
#view{min-height:70vh}
.wrap{padding:0 14px}
/* yuklanish */
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:50;text-align:center;padding:24px}
.boot .logo{font-size:30px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #2b2b3a;border-top-color:var(--acc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot p{color:var(--muted);margin:0;max-width:280px;font-size:14px}
.logo{font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* bosh sahifa */
.brand{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
.brand .logo{font-size:22px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px}
.banner{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 14px 4px;scrollbar-width:none}
.banner::-webkit-scrollbar,.row::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 88%;scroll-snap-align:center;height:200px;border-radius:18px;overflow:hidden;background:var(--card2)}
.slide .bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55);transform:scale(1.1)}
.slide .in{position:relative;display:flex;gap:12px;height:100%;padding:14px}
.slide .cv{flex:0 0 112px;height:100%;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px #0009}
.slide .tx{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.slide h3{margin:0 0 4px;font-size:18px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .g{color:#d9d9e6;font-size:12px;margin-bottom:6px}
.slide .d{color:#c4c4d2;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;font-weight:700;border-radius:12px;padding:11px 16px;font-size:15px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn.block{display:flex;width:100%}
.btn:active,.ch:active,.mini:active,.cc:active,.upd:active,.rk:active{transform:scale(.97)}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 14px 8px}
.sec-h h2{margin:0;font-size:18px}
.sec-h button{color:var(--acc2);font-size:14px;font-weight:600}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.mini{flex:0 0 108px;min-width:0}
.mini .cv{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2)}
.mini .t{font-size:13px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .s{font-size:12px;color:var(--muted);margin-top:2px}
.mini .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#0008}
.mini .bar i{display:block;height:100%;background:var(--acc)}
.rankno{position:absolute;left:-2px;bottom:-12px;font-size:56px;font-weight:900;line-height:1;color:#0b0b10;-webkit-text-stroke:2px #fff;text-shadow:0 2px 8px #000a}
.top10 .mini{flex-basis:118px;padding-left:16px}
.cv img,.cc img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff9;background:linear-gradient(135deg,#2a1f3d,#3d1f2a)}
.list{padding:0 14px;display:flex;flex-direction:column;gap:8px}
.upd{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.upd .cv{flex:0 0 52px;height:70px;border-radius:9px;overflow:hidden;background:var(--card2)}
.upd .m{flex:1;min-width:0}
.upd .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd .s{color:var(--muted);font-size:13px;margin-top:3px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--card2);color:var(--muted);white-space:nowrap}
.tag.free{background:#173a28;color:var(--green)}
.tag.paid{background:#3a2d12;color:var(--gold)}
.tag.new{background:var(--acc);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:#d4d4e0}
.chip.on{background:var(--text);color:#111;border-color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:48px 24px}
.empty .e{font-size:40px;margin-bottom:8px}
/* katalog */
.search{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,#0b0b1000);padding:12px 14px 10px}
.search input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--text);outline:none;font-size:16px}
.search input:focus{border-color:#45455a}
.filters{display:flex;gap:8px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;padding:12px 14px}
.cc{min-width:0}
.cc .cv{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--card2)}
.cc .t{font-size:13px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.badge{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:800;padding:3px 6px;border-radius:6px;background:#000b;color:#fff}
.badge.r{left:auto;right:6px;background:var(--acc)}
.count{color:var(--muted);font-size:13px;padding:0 14px}
/* manga sahifasi */
.hero{position:relative;overflow:hidden}
.hero .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) brightness(.45);transform:scale(1.15)}
.hero .fade{position:absolute;inset:0;background:linear-gradient(#0b0b1000 30%,var(--bg))}
.hero .in{position:relative;display:flex;gap:14px;padding:18px 14px 10px}
.hero .cv{flex:0 0 118px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px #000b;background:var(--card2)}
.hero .tx{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.hero h1{font-size:21px;line-height:1.2;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:#d0d0dc}
.meta b{color:var(--gold)}
.gen{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0}
.gen span{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--card2);color:#cfcfdc;border:1px solid var(--line)}
.acts{padding:14px 14px 4px}
.acts .btn{display:flex;width:100%;padding:13px 16px;font-size:16px}
.acts2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px 0}
.acts2 button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:#cfcfdc}
.acts2 button i{font-style:normal;font-size:19px;line-height:1}
.acts2 button.on{border-color:#ff5a3688;background:#24130f;color:#fff}
.ic{width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:19px}
.ic.on{border-color:var(--acc);background:#2a1712}
.desc{padding:10px 14px 0;color:#c9c9d6;font-size:14px;line-height:1.5;white-space:pre-line}
.desc.cut{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{padding:4px 14px 0;color:var(--acc2);font-size:14px;font-weight:600}
.small{color:var(--muted);font-size:13px;padding:6px 14px 0}
.chh{display:flex;align-items:center;justify-content:space-between;padding:20px 14px 10px}
.chh h2{margin:0;font-size:18px}
.chh button{color:var(--muted);font-size:13px;font-weight:600;background:var(--card2);border:1px solid var(--line);padding:6px 10px;border-radius:9px}
.chgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px 20px}
.ch{position:relative;border-radius:12px;overflow:hidden;background:var(--card2);aspect-ratio:3/4}
.ch .im{position:absolute;inset:0}
.ch .shade{position:absolute;inset:0;background:linear-gradient(#0000 45%,#000d)}
.ch .n{position:absolute;left:8px;bottom:7px;font-weight:800;font-size:14px;text-shadow:0 1px 3px #000}
.ch .tt{position:absolute;left:8px;right:8px;bottom:26px;font-size:11px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .lk{position:absolute;top:6px;right:6px;font-size:11.5px;font-weight:800;padding:3px 7px;border-radius:8px;background:#000c;color:var(--gold);border:1px solid #ffc53d55}
.ch .nw{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;background:var(--acc);color:#fff}
.ch.read .im{opacity:.45}
.ch .ok{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#062;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.ch.locked .im{filter:brightness(.6)}
/* o'quvchi */
.rd{max-width:900px;margin:0 auto;background:#000;padding-top:58px}
.pg{width:100%;height:auto;min-height:60vh;background:#0d0d12 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="none" stroke="%23333" stroke-width="3"/></svg>') center no-repeat}
.pg.ok{min-height:0;background:none}
.pg.err{min-height:120px}
.rd-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#000d;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s}
.rd-top.hide{transform:translateY(-110%)}
.rd-top .ic{width:38px;height:38px;flex-basis:38px;font-size:20px}
.rd-t{flex:1;min-width:0;line-height:1.2}
.rd-t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.rd-t span{font-size:12px;color:var(--muted)}
.rd-pg{font-size:12px;color:var(--muted);background:var(--card2);padding:5px 9px;border-radius:8px}
.rd-end{padding:28px 16px calc(28px + var(--safe));text-align:center;background:var(--bg)}
.rd-end h3{margin:0 0 6px}
.rd-end p{color:var(--muted);margin:0 0 16px;font-size:14px}
.rd-nav{display:flex;gap:10px;margin-bottom:10px}
.rd-nav .btn{flex:1}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:70vh;padding:24px;gap:10px}
.center .e{font-size:46px}
.center h3{margin:4px 0}
.center p{color:var(--muted);margin:0 0 10px;max-width:300px}
/* reyting */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 14px 8px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 4px #0006}
.hint{color:var(--dim);font-size:12.5px;padding:0 14px 10px}
.rk{display:flex;align-items:center;gap:12px;padding:8px 14px}
.rk .no{flex:0 0 30px;text-align:center;font-weight:900;font-size:18px;color:var(--muted)}
.rk .no.m1{color:#ffd24a}.rk .no.m2{color:#cfd6e0}.rk .no.m3{color:#e39a5b}
.rk .cv{flex:0 0 50px;height:66px;border-radius:9px;overflow:hidden;background:var(--card2)}
.rk .m{flex:1;min-width:0}
.rk .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .s{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .v{text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
.rk .dl{display:block;font-size:11.5px;font-weight:800;margin-top:2px}
.up{color:var(--green)}.dn{color:var(--red)}.nw2{color:var(--acc2)}
/* profil */
.prof{display:flex;align-items:center;gap:14px;padding:20px 14px 8px}
.av{width:60px;height:60px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--acc),#7a2cff);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:0 0 60px}
.av img{width:100%;height:100%;object-fit:cover}
.prof h2{margin:0;font-size:19px}
.prof .u{color:var(--muted);font-size:13px;margin-top:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column}
.card .btn{margin-top:auto}
.card .k{color:var(--muted);font-size:12.5px}
.card .v{font-size:20px;font-weight:800;margin:4px 0 10px}
/* oyna */
.back{position:fixed;inset:0;background:#000a;z-index:40;opacity:0;transition:opacity .2s}
.back.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(20px + var(--safe));transform:translateY(100%);transition:transform .25s;text-align:center;max-height:85vh;overflow:auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#3a3a4a;margin:0 auto 12px}
.sheet h3{margin:6px 0}
.sheet p{color:var(--muted);margin:0 0 16px}
.sheet .btn{display:flex;width:100%;margin-top:8px}
.big{font-size:44px}
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0 18px}
.stars button{font-size:38px;line-height:1;filter:grayscale(1) brightness(.7);transition:transform .1s}
.stars button.on{filter:none}
.stars button:active{transform:scale(1.2)}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe));transform:translate(-50%,20px);width:max-content;background:#262633;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 6px 20px #0008}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.reading .toast{bottom:calc(24px + var(--safe))}
/* pastki menyu */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#101017f2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);padding:4px 0}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--text)}
.tabs button.on svg{stroke:var(--acc)}
body.reading .tabs{display:none}
.skel{background:linear-gradient(90deg,#17171f,#21212c,#17171f);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.subs{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="logo">MANHORA</div><div class="spin"></div><p id="bootMsg">Yuklanmoqda…</p></div>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Asosiy</span></button>
  <button data-tab="catalog"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Katalog</span></button>
  <button data-tab="top"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span>Reyting</span></button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profil</span></button>
</nav>
<div class="toast" id="toast"></div>
<script>
"use strict";
const tg = (window.Telegram && window.Telegram.WebApp) || {initData: "", initDataUnsafe: {}, ready() {}, expand() {},
  isVersionAtLeast() { return false; }, BackButton: {show() {}, hide() {}, onClick() {}}, openTelegramLink(u) { location.href = u; },
  openLink(u) { location.href = u; }, close() {}, HapticFeedback: null};
const ver = v => { try { return tg.isVersionAtLeast(v); } catch (e) { return false; } };
const S = {boot: null, nav: [], scroll: {}, manga: {}, rating: {}, me: null,
  f: {q: "", g: "", st: "", sort: "pop"}, desc: true, period: "week", reader: null};
const $ = id => document.getElementById(id);
const V = $("view");

/* ---------- yordamchilar ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }
function num(n) { n = +n || 0; if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".0", "").replace(".", ",") + " mln"; if (n >= 1e3) return (n / 1e3).toFixed(1).replace(".0", "").replace(".", ",") + " ming"; return String(n); }
function ago(ts) {
  if (!ts) return "";
  const s = Date.now() / 1000 - ts;
  if (s < 90) return "hozirgina";
  if (s < 3600) return Math.round(s / 60) + " daqiqa oldin";
  if (s < 86400) return Math.round(s / 3600) + " soat oldin";
  if (s < 172800) return "kecha";
  if (s < 7 * 86400) return Math.floor(s / 86400) + " kun oldin";
  const d = new Date(ts * 1000);
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
}
function initials(t) { return (String(t || "").trim().split(/\s+/).slice(0, 2).map(w => (w.match(/[\p{L}\p{N}]/u) || [""])[0]).join("") || "M").toUpperCase(); }
function img(src, title, eager) {
  if (!src) return `<div class="ph">${initials(title)}</div>`;
  return `<img src="${esc(src)}" alt="" ${eager ? "" : 'loading="lazy"'} decoding="async" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;ph&quot;>${initials(title)}</div>'">`;
}
const STATUS = {ongoing: "Davom etmoqda", completed: "Tugagan", hiatus: "To‘xtatilgan", soon: "Tez orada"};
function hap(kind) {
  try {
    const h = tg.HapticFeedback; if (!h || !ver("6.1")) return;
    if (kind === "ok" || kind === "err") h.notificationOccurred(kind === "ok" ? "success" : "error"); else h.impactOccurred(kind || "light");
  } catch (e) {}
}
let toastT = 0;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }
function byCode(code) { return (S.boot && S.boot.catalog.find(m => m.code === String(code))) || null; }
function botLink(arg) { return "https://t.me/" + (S.boot && S.boot.bot || "ManhoraBot") + (arg ? "?start=" + arg : ""); }
function openTg(url) { try { if (ver("6.1")) { tg.openTelegramLink(url); return; } } catch (e) {} location.href = url; }

async function api(name, params, post) {
  let url = "/api/" + name, opt = {headers: {"X-Init-Data": tg.initData || ""}};
  if (post) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(params || {}); }
  else if (params) url += "?" + new URLSearchParams(params).toString();
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  opt.signal = ctl.signal;
  let r, data;
  try { r = await fetch(url, opt); } finally { clearTimeout(t); }
  try { data = await r.json(); } catch (e) { data = {error: "Server javobi tushunarsiz (" + r.status + ")"}; }
  if (!r.ok) { const err = new Error(data.error || ("Xato " + r.status)); err.status = r.status; err.data = data; throw err; }
  return data;
}

/* ---------- navigatsiya ---------- */
const ROOTS = {home: 1, catalog: 1, top: 1, me: 1};
function go(route, replace) {
  const cur = S.nav[S.nav.length - 1];
  if (cur) S.scroll[cur] = window.scrollY;
  if (replace && S.nav.length) S.nav[S.nav.length - 1] = route; else S.nav.push(route);
  if (S.nav.length > 40) S.nav.splice(0, S.nav.length - 40);
  render(false);
}
function tab(route) { const cur = S.nav[S.nav.length - 1]; if (cur) S.scroll[cur] = window.scrollY; S.nav = [route]; render(false); }
function back() {
  if ($("sht")) { closeSheet(); return; }
  if (S.nav.length > 1) { S.nav.pop(); render(true); } else if (S.nav[0] !== "home") { S.nav = ["home"]; render(true); }
}
function render(restore) {
  const route = S.nav[S.nav.length - 1] || "home";
  const [name, a, b] = route.split("/");
  document.body.classList.toggle("reading", name === "r");
  document.querySelectorAll(".tabs button").forEach(el => el.classList.toggle("on", el.dataset.tab === name));
  try { if (S.nav.length > 1 || !ROOTS[name]) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
  if (S.reader) { try { S.reader.obs.disconnect(); S.reader.off(); } catch (e) {} S.reader = null; }
  const y = restore ? (S.scroll[route] || 0) : 0;
  if (name === "home") V.innerHTML = vHome();
  else if (name === "catalog") { V.innerHTML = vCatalog(); bindSearch(); }
  else if (name === "top") vTop();
  else if (name === "me") vMe();
  else if (name === "m") vManga(a, restore);
  else if (name === "r") vReader(a, b);
  else V.innerHTML = vHome();
  window.scrollTo(0, y);
}

function setupReader(d) {
  const top = $("rdTop"), pg = $("rdPg"), imgs = Array.from(document.querySelectorAll(".pg"));
  imgs.forEach(im => {
    im.addEventListener("load", () => im.classList.add("ok"));
    im.addEventListener("error", () => {
      if (!im.dataset.retry) { im.dataset.retry = "1"; setTimeout(() => { im.src = im.src + (im.src.includes("?") ? "&" : "?") + "r=1"; }, 1500); }
      else { im.classList.add("err"); }
    });
  });
  const obs = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) pg.textContent = (+e.target.dataset.i + 1) + "/" + imgs.length; });
  }, {rootMargin: "-45% 0px -45% 0px"});
  imgs.forEach(im => obs.observe(im));
  let lastY = window.scrollY;
  const onScroll = () => { const y = window.scrollY; if (Math.abs(y - lastY) > 12) { top.classList.toggle("hide", y > lastY && y > 80); lastY = y; } };
  window.addEventListener("scroll", onScroll, {passive: true});
  $("rd").addEventListener("click", () => top.classList.toggle("hide"));
  S.reader = {obs, off: () => window.removeEventListener("scroll", onScroll)};
}

  V.innerHTML = `<div class="center"><div class="e">📢</div><h3>Kanalga obuna bo‘ling</h3>
  <p>Mangalarni o‘qish uchun quyidagi kanal${list.length > 1 ? "lar" : ""}ga obuna bo‘ling, so‘ng «Tekshirish» ni bosing.</p>
  <div class="subs">${list.map(c => `<button class="btn ghost" data-act="openlink" data-url="${esc(c.url)}">📢 ${esc(c.title)}</button>`).join("")}
  <button class="btn" data-act="subcheck">✅ Tekshirish</button></div></div>`;
  S.afterSub = after;
}
function errHtml(e) {
  return `<div class="center"><div class="e">😕</div><h3>Xatolik</h3><p>${esc(e && e.message || "Nimadir noto‘g‘ri ketdi")}</p>
  <button class="btn" data-act="retry">🔄 Qayta urinish</button></div>`;
}

/* ---------- reyting ---------- */
const PERIODS = [["week", "Hafta"], ["month", "Oy"], ["all", "Barcha"], ["stars", "⭐ Baho"]];
const PHINT = {week: "So‘nggi 7 kunda nechta odam o‘qigani bo‘yicha", month: "So‘nggi 30 kunda nechta odam o‘qigani bo‘yicha",
  all: "Umumiy ko‘rishlar bo‘yicha", stars: "O‘quvchilar qo‘ygan yulduzlar bo‘yicha"};
function rkItem(it, p) {
  const no = it.rank <= 3 ? `m${it.rank}` : "";
  let dl = "";
  if (p === "week" || p === "month") dl = it.new ? `<span class="dl nw2">YANGI</span>` : it.delta > 0 ? `<span class="dl up">▲ ${it.delta}</span>` : it.delta < 0 ? `<span class="dl dn">▼ ${-it.delta}</span>` : `<span class="dl" style="color:var(--dim)">—</span>`;
  const val = p === "stars" ? `⭐ ${(+it.value).toFixed(1)}<span class="dl" style="color:var(--muted)">${it.votes} baho</span>` : `👁 ${num(it.value)}${dl}`;
  return `<div class="rk" data-go="m/${it.code}"><div class="no ${no}">${it.rank <= 3 ? ["🥇", "🥈", "🥉"][it.rank - 1] : it.rank}</div>
  <div class="cv">${img(it.cover, it.title)}</div><div class="m"><div class="t">${esc(it.title)}</div><div class="s">${esc((it.genres || []).join(" · "))}</div></div>
  <div class="v">${val}</div></div>`;
}
async function vTop() {
  const p = S.period;
  const head = `<div class="seg">${PERIODS.map(([k, t]) => `<button class="${k === p ? "on" : ""}" data-period="${k}">${t}</button>`).join("")}</div><div class="hint">${PHINT[p]}</div>`;
  const c = S.rating[p];
  V.innerHTML = head + (c ? c.html : `<div class="list">${'<div class="skel" style="height:70px"></div>'.repeat(6)}</div>`);
  if (c && Date.now() - c.t < 60000) return;
  try {
    const d = await api("rating", {period: p});
    const html = d.items.length ? d.items.map(it => rkItem(it, p)).join("") + `<div style="height:16px"></div>`
      : `<div class="empty"><div class="e">📊</div>Hozircha ma’lumot yo‘q — o‘qishlar ko‘paygani sari reyting to‘ladi.</div>`;
    S.rating[p] = {t: Date.now(), html};
    if (S.nav[S.nav.length - 1] === "top" && S.period === p) V.innerHTML = head + html;
  } catch (e) { if (!c) V.innerHTML = head + errHtml(e); }
}

/* ---------- profil ---------- */
function vMe() {
  const me = S.boot.me;
  const vipTill = me.vip ? new Date(me.vip_until * 1000).toLocaleDateString("ru-RU") + " gacha" : "barcha boblar ochiq bo‘ladi";
  const head = `<div class="prof"><div class="av">${me.photo ? `<img src="${esc(me.photo)}" alt="">` : initials(me.name)}</div>
  <div><h2>${esc(me.name || "Foydalanuvchi")}</h2><div class="u">${me.username ? "@" + esc(me.username) + " · " : ""}ID ${me.id}</div></div></div>
  <div class="cards"><div class="card"><div class="k">🪙 Jetonlar</div><div class="v">${me.jetons}<span class="k" style="display:block;font-size:11.5px;font-weight:500;margin-top:2px">pullik boblarni ochish uchun</span></div><button class="btn sm block" data-act="shop">Jeton olish</button></div>
  <div class="card"><div class="k">💎 VIP</div><div class="v">${me.vip ? "Faol" : "Yo‘q"}<span class="k" style="display:block;font-size:11.5px;font-weight:500;margin-top:2px">${vipTill}</span></div><button class="btn sm ghost block" data-act="vip">${me.vip ? "Uzaytirish" : "VIP olish"}</button></div></div>`;
  V.innerHTML = head + `<div id="meRest">${meRest(S.me)}</div>`;
  api("me").then(d => {
    S.me = d; S.boot.me = d.me;
    if (S.nav[S.nav.length - 1] === "me") { const el = $("meRest"); if (el) el.innerHTML = meRest(d); }
  }).catch(() => {});
}
function meRest(d) {
  if (!d) return `<div class="list" style="margin-top:14px">${'<div class="skel" style="height:70px"></div>'.repeat(3)}</div>`;
  let h = "";
  if (d.continue.length) h += sec("🕘 O‘qish tarixi", d.continue.map(c => `<div class="upd" data-go="m/${c.code}"><div class="cv">${img(c.cover, c.title)}</div>
    <div class="m"><div class="t">${esc(c.title)}</div><div class="s">${esc(c.n)}-bob o‘qildi${c.next ? ` · keyingisi ${esc(c.next)}-bob` : ""}</div></div>
    ${c.next ? `<span class="btn sm" data-ch="${esc(c.code)}/${esc(c.next)}">▶️</span>` : ""}</div>`).join(""), "list");
  if (d.favs.length) h += sec("❤️ Sevimlilar", d.favs.map(m => mini(m, m.chapters ? m.chapters + " bob" : "")).join(""), "row");
  if (!h) h = `<div class="empty"><div class="e">📚</div>Hali hech narsa o‘qimadingiz.<br>Katalogdan boshlang!</div>`;
  return h + `<div class="wrap" style="margin:22px 0 10px"><button class="btn ghost block" data-act="openlink" data-url="${esc(botLink(""))}">🤖 Botga o‘tish</button></div>`;
}

/* ---------- tugmalar ---------- */
async function toggle(kind, code, el) {
  hap("light");
  try {
    const r = await api(kind, {code}, true);
    const mc = S.manga[code]; if (mc) mc.d.manga[kind] = r.on;
    const list = kind === "fav" ? S.boot.me.favs : S.boot.me.follows;
    const i = list.indexOf(code); if (r.on && i < 0) list.push(code); if (!r.on && i >= 0) list.splice(i, 1);
    toast(kind === "fav" ? (r.on ? "❤️ Sevimlilarga qo‘shildi" : "Sevimlilardan olindi") : (r.on ? "🔔 Yangi bob chiqqanda xabar beramiz" : "🔕 Kuzatish to‘xtatildi"));
    if (el && el.dataset.reader) { el.textContent = r.on ? "🔔 Kuzatyapsiz" : "🔔 Kuzatish"; el.classList.toggle("ghost", r.on); }
    else if (mc && S.nav[S.nav.length - 1] === "m/" + code) { const y = window.scrollY; V.innerHTML = mangaHtml(mc.d); window.scrollTo(0, y); }
  } catch (e) { toast(e.message); hap("err"); }
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-go],[data-tab],[data-act],[data-ch],[data-g],[data-genre],[data-sort],[data-st],[data-period]");
  if (!el || el.disabled) return;
  const ds = el.dataset;
  if (ds.tab) { hap("light"); tab(ds.tab); return; }
  if (ds.go) { hap("light"); go(ds.go); return; }
  if (ds.ch) { e.stopPropagation(); hap("light"); const [code, n] = ds.ch.split("/"); openChapter(code, n); return; }
  if (ds.genre !== undefined) { S.f.g = ds.genre; S.f.q = ""; tab("catalog"); return; }
  if (ds.g !== undefined) { S.f.g = ds.g; V.innerHTML = vCatalog(); bindSearch(); return; }
  if (ds.sort) { S.f.sort = ds.sort; V.innerHTML = vCatalog(); bindSearch(); return; }
  if (ds.st !== undefined) { S.f.st = S.f.st === ds.st ? "" : ds.st; V.innerHTML = vCatalog(); bindSearch(); return; }
  if (ds.period) { S.period = ds.period; hap("light"); vTop(); return; }
  const a = ds.act;
  if (a === "back") back();
  else if (a === "close") closeSheet();
  else if (a === "retry") render(true);
  else if (a === "fav" || a === "follow") toggle(a, ds.code, el);
  else if (a === "rate") rateSheet(ds.code);
  else if (a === "desc") { const d = $("desc"); if (d) { d.classList.toggle("cut"); el.textContent = d.classList.contains("cut") ? "Batafsil ▾" : "Yig‘ish ▴"; } }
  else if (a === "sort") { S.desc = !S.desc; const mc = S.manga[(S.nav[S.nav.length - 1] || "").split("/")[1]]; if (mc) { const y = window.scrollY; V.innerHTML = mangaHtml(mc.d); window.scrollTo(0, y); } }
  else if (a === "share") {
    const m = byCode(ds.code) || {title: ""};
    openTg("https://t.me/share/url?url=" + encodeURIComponent(botLink(ds.code)) + "&text=" + encodeURIComponent("📖 " + m.title + " — o‘zbek tilida o‘qing!"));
  }
  else if (a === "lock") lockedSheet(ds.code, ds.n, {price: +ds.price});
  else if (a === "buy") {
    el.disabled = true;
    try {
      const r = await api("buy", {code: ds.code, num: ds.n}, true);
      S.boot.me.jetons = r.balance; hap("ok"); toast(`✅ Bob ochildi! Qoldiq: ${r.balance} 🪙`); closeSheet();
      const mc = S.manga[ds.code]; if (mc) { const c = mc.d.chapters.find(x => x.n === ds.n); if (c) c.open = true; }
      const cur = S.nav[S.nav.length - 1];
      if (cur === `r/${ds.code}/${ds.n}`) render(false); else go(`r/${ds.code}/${ds.n}`);
    } catch (err) { el.disabled = false; hap("err"); toast(err.message); }
  }
  else if (a === "ratesave") {
    const v = +($("stars").dataset.v || 0);
    if (!v) { toast("Yulduzni tanlang"); return; }
    try {
      const r = await api("rate", {code: ds.code, stars: v}, true);
      hap("ok"); toast(`Rahmat! Bahoyingiz: ${v} ⭐`); closeSheet();
      const mc = S.manga[ds.code]; if (mc) { Object.assign(mc.d.manga, {stars: r.stars, votes: r.votes, mine: v}); if (S.nav[S.nav.length - 1] === "m/" + ds.code) { const y = window.scrollY; V.innerHTML = mangaHtml(mc.d); window.scrollTo(0, y); } }
      const bm = byCode(ds.code); if (bm) { bm.stars = r.stars; bm.votes = r.votes; }
      S.rating = {};
    } catch (err) { hap("err"); toast(err.message); }
  }
  else if (a === "readbot") {
    el.disabled = true;
    try { await api("readbot", {code: ds.code, num: ds.n}, true); toast("📨 Bob botga yuborildi"); setTimeout(() => { try { tg.close(); } catch (x) {} }, 700); }
    catch (err) { el.disabled = false; toast(err.message); }
  }
  else if (a === "shop" || a === "vip") { openTg(botLink(a)); }
  else if (a === "openlink") { openTg(ds.url); }
  else if (a === "subcheck") {
    try {
      const r = await api("subcheck", {}, true);
      if (r.ok) { hap("ok"); toast("Rahmat! ✅"); S.boot.need_sub = []; const f = S.afterSub; S.afterSub = null; if (f) f(); else tab("home"); }
      else { hap("err"); toast("Hali obuna bo‘lmagansiz 🙂"); }
    } catch (err) { toast(err.message); }
  }
});

/* ---------- ishga tushirish ---------- */
function startRoute(b) {
  const q = new URLSearchParams(location.search);
  let sp = b.start || q.get("tgWebAppStartParam") || "";
  if (q.get("m")) sp = "m" + q.get("m"); else if (q.get("c")) sp = "c" + q.get("c"); else if (q.get("p")) sp = q.get("p");
  let mt;
  if (sp === "top" || sp === "catalog" || sp === "me") return [sp];
  if ((mt = /^c?(\d+)[_-](\d+(?:[.-]\d+)?)$/.exec(sp))) return ["home", "m/" + mt[1], "r/" + mt[1] + "/" + mt[2].replace("-", ".")];
  if ((mt = /^m?(\d+)$/.exec(sp))) return ["home", "m/" + mt[1]];
  return ["home"];
}
async function start() {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { if (ver("6.1")) { tg.setHeaderColor("#0b0b10"); tg.setBackgroundColor("#0b0b10"); } if (ver("7.10")) tg.setBottomBarColor("#101017"); } catch (e) {}
  try { if (ver("7.7")) tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.BackButton.onClick(back); } catch (e) {}
  if (!tg.initData) {
    $("boot").innerHTML = `<div class="logo" style="font-size:30px">MANHORA</div><p>Ilova Telegram ichida ochiladi.</p><a class="btn" href="https://t.me/ManhoraBot">🤖 Botni ochish</a>`;
    return;
  }
  const msg = $("bootMsg"), slow = setTimeout(() => { msg.textContent = "Server uyg‘onmoqda… Bepul serverda birinchi ochilish 1 daqiqagacha cho‘zilishi mumkin ⏳"; }, 3500);
  let b = null, err = null;
  for (let i = 0; i < 8 && !b; i++) {
    try { b = await api("boot"); }
    catch (e) { err = e; if (e.status && e.status < 500 && e.status !== 429) break; await new Promise(r => setTimeout(r, 4000)); }
  }
  clearTimeout(slow);
  if (!b) {
    $("boot").innerHTML = `<div class="e" style="font-size:44px">😕</div><p>${esc(err && err.message || "Serverga ulanib bo‘lmadi")}</p><button class="btn" onclick="location.reload()">🔄 Qayta urinish</button>`;
    return;
  }
  S.boot = b;
  $("boot").remove();
  S.nav = startRoute(b);
  if (b.need_sub && b.need_sub.length) { subScreen(b.need_sub, () => render(false)); document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on")); return; }
  render(false);
}
start();
</script>
